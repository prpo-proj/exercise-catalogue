openapi: "3.1.0"
info:
  title: Exercise Catalogue API
  description: Public, read-only catalogue of strength exercises.
  version: 1.0.0
  contact:
      name: Workout Tracker
      url: https://github.com/prpo-proj/exercise-catalogue
servers:
  - url: http://localhost:8080/v1

tags:
  - name: Exercises
    description: Browse catalogue exercises.

paths:
  /exercises:
    get:
      tags:
        - Exercises
      summary: List catalogue exercises
      description: Results are sorted by name ascending, then by ID ascending. If no matches remain at the requested offset, items is empty.
      operationId: getExercises
      security: []

      parameters:
        - name: name
          in: query
          required: false
          description: Case-insensitive substring of the exercise name.
          schema:
            type: string

        - name: limit
          in: query
          required: false
          description: Maximum number of exercises per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - name: offset
          in: query
          required: false
          description: Number of matches to skip.
          schema:
            type: integer
            minimum: 0
            default: 0

      responses:
        '200':
          description: One page of matching exercises.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExercisePage'

        '400':
          description: "INVALID_QUERY_PARAMETERS: One or more query parameters are invalid."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /exercises/{catalogueExerciseId}:
    parameters:
      - name: catalogueExerciseId
        in: path
        required: true
        description: Catalogue exercise ID.
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Exercises
      summary: Get a catalogue exercise by ID
      description: Returns the exercise ID and display name.
      operationId: getExercise
      security: []

      responses:
        '200':
          description: The requested catalogue exercise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        
        '404':
          description: "RESOURCE_NOT_FOUND: No exercise has this ID."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    Exercise:
      description: A shared catalogue entry.
      type: object
      required:
        - id
        - name
      properties:
        id:
          description: Unique identifier of the catalogue exercise.
          type: string
          format: uuid
        
        name:
          description: Display name of the exercise.
          type: string
    
    ExercisePage:
      description: A page of results from the catalogue.
      type: object
      required:
        - items
        - limit
        - offset
        - total
      properties: 
        items:
          description: Exercises on this page.
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
        
        limit:
          description: Page size used for this request.
          type: integer
          minimum: 1
          maximum: 100

        offset:
          description: Offset used for this page.
          type: integer
          minimum: 0
        
        total:
          description: Number of matches before pagination.
          type: integer
          minimum: 0

    Problem:
      description: RFC 9457 Problem Details with an application error code and optional field errors.
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          const: "about:blank"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
      additionalProperties: true
